<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Admin | Pixara Digital Studio</title>
  <link rel="icon" href="logo.png">
  <link rel="stylesheet" href="style.css">
  <style>
    .wrap{max-width:900px;margin:20px auto;padding:0 16px}
    .panel{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
    .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin-bottom:10px}
    label{font-size:13px;color:#555;display:block;margin-bottom:3px}
    .vrow{display:grid;grid-template-columns:2fr 1.5fr 1fr auto;gap:8px;margin-bottom:6px}
    .item{display:flex;gap:12px;align-items:center;border-top:1px solid var(--line);padding:10px 0;flex-wrap:wrap}
    .item img{width:60px;height:60px;object-fit:cover;border-radius:8px}
    .item .grow{flex:1;min-width:140px}
    .item button{margin-left:6px;padding:7px 12px}
    .hide{display:none!important}
    .msg{color:var(--red);font-size:14px}
    .imgs{display:flex;flex-wrap:wrap;gap:10px;margin:8px 0}
    .im{width:96px;text-align:center;font-size:12px}
    .im img{width:96px;height:96px;object-fit:cover;border-radius:8px;border:2px solid var(--line)}
    .im.main img{border-color:var(--navy)}
    .im button{border:0;background:#eee;border-radius:6px;padding:3px 7px;cursor:pointer;margin:3px 1px;font-size:12px}
  </style>
</head>
<body>
  <header class="top">
    <div class="bar">
      <span class="brand">Pixara Digital Studio &middot; Admin</span>
      <button class="btn gray hide" id="out">Sign out</button>
    </div>
  </header>

  <div class="wrap">
    <div class="panel" id="login">
      <p>Sign in with the authorised Google account.</p>
      <button class="btn navy" id="in">Sign in with Google</button>
      <p class="msg" id="lmsg"></p>
    </div>

    <div id="app" class="hide">
      <div class="panel">
        <h3 id="ftitle">Add product</h3>

        <div class="row">
          <div>
            <label>Name</label>
            <input id="name">
          </div>
          <div>
            <label>Type</label>
            <select id="type">
              <option value="wood">Wood (shows Wooden Frame)</option>
              <option value="plastic">Plastic (shows Plastic Frame)</option>
              <option value="acrylic">Acrylic (shows Acrylic Frame)</option>
              <option value="design">Design (shows Designer Frame)</option>
            </select>
          </div>
          <div>
            <label>Discount %</label>
            <input id="disc" type="number" min="0" max="95" value="0">
          </div>
        </div>

        <div class="row">
          <div>
            <label>Description</label>
            <textarea id="desc" rows="2"></textarea>
          </div>
          <div>
            <label>Shape (optional, e.g. Heart, Clock)</label>
            <input id="shape">
          </div>
        </div>

        <label>Photos (up to 6). The first photo is the main one.</label>
        <input id="file" type="file" accept="image/*" multiple>
        <span class="msg" id="umsg"></span>
        <div class="imgs" id="imgs"></div>

        <label>Sizes and listed prices (INR)</label>
        <div id="vars"></div>
        <button class="btn navy" id="addVar" type="button" style="margin:4px 0 10px">+ Add size</button>

        <div class="row">
          <label><input type="checkbox" id="vis" checked style="width:auto"> Visible on site</label>
          <label><input type="checkbox" id="stock" checked style="width:auto"> In stock</label>
        </div>

        <button class="btn" id="save">Save product</button>
        <button class="btn gray" id="reset">Clear</button>
        <span class="msg" id="smsg"></span>
      </div>

      <div class="panel">
        <h3>Products</h3>
        <div id="list"></div>
      </div>

      <div class="panel">
        <h3>Site settings</h3>
        <div class="row">
          <div>
            <label>WhatsApp number (with country code)</label>
            <input id="wa" value="918811008135">
          </div>
        </div>
        <label>Delivery note</label>
        <textarea id="dn" rows="2">We currently deliver across North East India. Orders are prepaid only; Cash on Delivery is not available.</textarea>
        <br><br>
        <button class="btn navy" id="saveSet">Save settings</button>
        <span class="msg" id="setmsg"></span>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc, setDoc, updateDoc, deleteDoc, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA3G585G66_KhwTZ_NDZgA7ika5PPbA4YM",
      authDomain: "pixara-studio-da1c4.firebaseapp.com",
      projectId: "pixara-studio-da1c4",
      storageBucket: "pixara-studio-da1c4.firebasestorage.app",
      messagingSenderId: "727202048584",
      appId: "1:727202048584:web:01127920f2b78754d4467d"
    };

    const ADMIN = "mrinal8753855953@gmail.com";
    const CLOUD = "xlnd1mfb";
    const PRESET = "pixara_studio";
    const MAXIMG = 6;
    const SIZES = ["4x6", "5x7", "6x8", "8x10", "10x12"];

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const $ = id => document.getElementById(id);

    let editing = null;
    let imgs = [];
    let uploading = false;

    const thumb = u => {
      if (!u) return "";
      if (u.includes("/upload/f_auto,q_auto,c_fill,w_200,h_200/")) return u;
      return u.replace("/upload/", "/upload/f_auto,q_auto,c_fill,w_200,h_200/");
    };

    $("in").onclick = () =>
      signInWithPopup(auth, new GoogleAuthProvider()).catch(e => $("lmsg").textContent = e.message);

    $("out").onclick = () => signOut(auth);

    onAuthStateChanged(auth, u => {
      const ok = u && u.email === ADMIN;
      $("login").classList.toggle("hide", !!ok);
      $("app").classList.toggle("hide", !ok);
      $("out").classList.toggle("hide", !u);

      if (u && !ok) {
        $("lmsg").textContent = "This account is not authorised.";
        signOut(auth);
      }

      if (ok) {
        load();
        loadSettings();
      }
    });

    function vrow(v = { size: "", style: "standard", price: "" }) {
      const d = document.createElement("div");
      d.className = "vrow";
      d.innerHTML = `
        <input list="sz" placeholder="Size e.g. 8x10 or Heart 10 inch">
        <select>
          <option value="standard">Standard</option>
          <option value="topstand">Top Stand</option>
        </select>
        <input type="number" min="0" placeholder="Listed price">
        <button type="button" class="btn red">x</button>
      `;
      d.children[0].value = v.size;
      d.children[1].value = v.style;
      d.children[2].value = v.price;
      d.children[3].onclick = () => d.remove();
      $("vars").appendChild(d);
    }

    document.body.insertAdjacentHTML(
      "beforeend",
      `<datalist id="sz">${SIZES.map(s => `<option value="${s}">`).join("")}</datalist>`
    );

    $("addVar").onclick = () => vrow();

    function renderImgs() {
      $("imgs").innerHTML = "";
      imgs.forEach((u, i) => {
        const d = document.createElement("div");
        d.className = "im" + (i === 0 ? " main" : "");
        d.innerHTML = `
          <img src="${thumb(u)}?v=${i}-${Date.now()}" alt="">
          <div>
            ${i === 0 ? "Main" : '<button type="button" data-a="m">Make main</button>'}
            <button type="button" data-a="l">&larr;</button>
            <button type="button" data-a="r">&rarr;</button>
            <button type="button" data-a="x">Remove</button>
          </div>
        `;
        d.querySelectorAll("button").forEach(b => b.onclick = () => {
          const a = b.dataset.a;
          if (a === "x") imgs.splice(i, 1);
          else if (a === "m") imgs.unshift(imgs.splice(i, 1)[0]);
          else if (a === "l" && i > 0) [imgs[i - 1], imgs[i]] = [imgs[i], imgs[i - 1]];
          else if (a === "r" && i < imgs.length - 1) [imgs[i + 1], imgs[i]] = [imgs[i], imgs[i + 1]];
          renderImgs();
        });
        $("imgs").appendChild(d);
      });
    }

    function clearForm() {
      editing = null;
      imgs = [];
      $("ftitle").textContent = "Add product";
      ["name", "desc", "shape"].forEach(i => $(i).value = "");
      $("disc").value = 0;
      $("type").value = "wood";
      $("vis").checked = true;
      $("stock").checked = true;
      $("file").value = "";
      $("vars").innerHTML = "";
      vrow();
      $("smsg").textContent = "";
      $("umsg").textContent = "";
      renderImgs();
    }

    $("reset").onclick = clearForm;
    clearForm();

    function shrink(file) {
      return new Promise((res, rej) => {
        const im = new Image();
        im.onload = () => {
          const m = 1600;
          const r = Math.min(1, m / Math.max(im.width, im.height));
          const c = document.createElement("canvas");
          c.width = im.width * r;
          c.height = im.height * r;
          c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
          c.toBlob(res, "image/jpeg", 0.86);
        };
        im.onerror = () => rej(new Error("Could not read image"));
        im.src = URL.createObjectURL(file);
      });
    }

    $("file").onchange = async () => {
      const files = [...$("file").files];
      if (!files.length) return;
      uploading = true;

      try {
        for (const f of files) {
          if (imgs.length >= MAXIMG) {
            $("umsg").textContent = "Maximum " + MAXIMG + " photos.";
            break;
          }

          $("umsg").textContent = "Uploading " + f.name + "...";
          const b = await shrink(f);

          const fd = new FormData();
          fd.append("file", b, "photo.jpg");
          fd.append("upload_preset", PRESET);

          const rs = await fetch("https://api.cloudinary.com/v1_1/" + CLOUD + "/image/upload", {
            method: "POST",
            body: fd
          });

          const j = await rs.json();
          if (!j.secure_url) throw new Error((j.error && j.error.message) || "Image upload failed");

          imgs.push(j.secure_url);
          imgs = [...new Set(imgs.filter(Boolean))];
          renderImgs();
        }

        if (imgs.length < MAXIMG) $("umsg").textContent = "";
      } catch (e) {
        $("umsg").textContent = e.message;
      }

      uploading = false;
      $("file").value = "";
    };

    $("save").onclick = async () => {
      const m = $("smsg");
      if (uploading) {
        m.textContent = "Please wait for the photos to finish uploading.";
        return;
      }

      m.textContent = "Saving...";

      try {
        const variants = [...$("vars").children]
          .map(r => ({
            size: r.children[0].value.trim(),
            style: r.children[1].value,
            price: Number(r.children[2].value)
          }))
          .filter(v => v.size && v.price > 0);

        if (!$("name").value.trim() || !variants.length) {
          m.textContent = "Name and at least one size with a price are required.";
          return;
        }

        const cleanImgs = [...new Set(imgs.filter(Boolean))];

        if (!cleanImgs.length) {
          m.textContent = "Please add at least one photo.";
          return;
        }

        const data = {
          name: $("name").value.trim(),
          type: $("type").value,
          description: $("desc").value.trim(),
          shape: $("shape").value.trim(),
          discountPercent: Math.min(95, Math.max(0, Number($("disc").value) || 0)),
          visible: $("vis").checked,
          inStock: $("stock").checked,
          variants,
          images: cleanImgs,
          imageUrl: cleanImgs[0] || ""
        };

        if (editing) {
          await updateDoc(doc(db, "products", editing), data);
        } else {
          await addDoc(collection(db, "products"), { ...data, createdAt: serverTimestamp() });
        }

        clearForm();
        m.textContent = "Saved.";
        load();
      } catch (e) {
        m.textContent = e.message;
      }
    };

    async function load() {
      const q = await getDocs(collection(db, "products"));
      const cache = q.docs.map(d => ({ id: d.id, ...d.data() }));

      $("list").innerHTML = cache.length ? "" : "No products yet.";

      cache.forEach(p => {
        const im = p.images && p.images.length ? p.images : [p.imageUrl];
        const d = document.createElement("div");
        d.className = "item";
        d.innerHTML = `
          <img src="${thumb(im[0])}?v=${p.id}" alt="">
          <div class="grow">
            <b></b><br>
            <small>${p.type} &middot; ${im.length} photo(s) &middot; ${p.discountPercent || 0}% off &middot; ${p.visible ? "visible" : "hidden"} &middot; ${p.inStock === false ? "out of stock" : "in stock"}</small>
          </div>
          <button class="btn navy">Edit</button>
          <button class="btn red">Delete</button>
        `;
        d.querySelector("b").textContent = p.name;
        d.querySelectorAll("button")[0].onclick = () => edit(p);
        d.querySelectorAll("button")[1].onclick = () => del(p);
        $("list").appendChild(d);
      });
    }

    function edit(p) {
      editing = p.id;
      imgs = [...(p.images && p.images.length ? p.images : [p.imageUrl])].filter(Boolean);
      $("ftitle").textContent = "Edit product";
      $("name").value = p.name;
      $("type").value = p.type;
      $("disc").value = p.discountPercent || 0;
      $("desc").value = p.description || "";
      $("shape").value = p.shape || "";
      $("vis").checked = !!p.visible;
      $("stock").checked = p.inStock !== false;
      $("file").value = "";
      $("vars").innerHTML = "";
      p.variants.forEach(vrow);
      renderImgs();
      scrollTo({ top: 0, behavior: "smooth" });
    }

    async function del(p) {
      if (!confirm("Delete " + p.name + "? This cannot be undone.")) return;
      await deleteDoc(doc(db, "products", p.id));
      load();
    }

    async function loadSettings() {
      const s = await getDoc(doc(db, "settings", "site"));
      if (s.exists()) {
        const x = s.data();
        $("wa").value = x.whatsapp || $("wa").value;
        $("dn").value = x.deliveryNote || $("dn").value;
      }
    }

    $("saveSet").onclick = async () => {
      try {
        await setDoc(doc(db, "settings", "site"), {
          whatsapp: $("wa").value.replace(/\D/g, ""),
          deliveryNote: $("dn").value.trim()
        });
        $("setmsg").textContent = "Saved.";
      } catch (e) {
        $("setmsg").textContent = e.message;
      }
    };
  </script>
</body>
</html>
